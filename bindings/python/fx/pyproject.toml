[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "openhub-bo-fx"
description = "Cobros QR con PIX (Brasil), activos virtuales (USDT/USDC vía Koibanx) y Binance Pay vía Red Enlace (ATC) OpenHub, Bolivia"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Felix Daniel Coca Calvimontes" }]
requires-python = ">=3.10"
# Lockstep versioning: every openhub-bo package is released with the same version.
dependencies = ["openhub-bo-core>=0.1.0,<0.2.0"]
dynamic = ["version"]
keywords = ["bolivia", "pix", "binance", "usdt", "usdc", "qr", "payments", "openhub", "red enlace", "atc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/drkpkg/openhub-bo-integration"
Source = "https://github.com/drkpkg/openhub-bo-integration"
Issues = "https://github.com/drkpkg/openhub-bo-integration/issues"

[tool.maturin]
python-source = "python"
module-name = "openhub_bo.fx._native"
features = ["pyo3/extension-module"]
exclude = ["**/__pycache__/**"]
