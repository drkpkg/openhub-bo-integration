[package]
name = "openhub-bo-accounts-py"
description = "Native module of the openhub-bo-accounts Python package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "openhub_bo_accounts_native"
crate-type = ["cdylib"]

[dependencies]
openhub-core = { path = "../../../crates/openhub-core" }
pyo3 = { version = "0.29.3", features = ["abi3-py310"] }
openhub-accounts = { path = "../../../crates/openhub-accounts" }
