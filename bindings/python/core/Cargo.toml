[package]
name = "openhub-bo-core-py"
description = "Native module of the openhub-bo-core Python package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "openhub_bo_core_native"
crate-type = ["cdylib"]

[dependencies]
openhub-core = { path = "../../../crates/openhub-core" }
pyo3 = { version = "0.29.3", features = ["abi3-py310"] }
