[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "openhub-bo-core"
description = "Base compartida (sesión, transporte, errores) de los clientes openhub-bo para Red Enlace (ATC) OpenHub, Bolivia"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Felix Daniel Coca Calvimontes" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
dynamic = ["version"]
keywords = ["bolivia", "payments", "openhub", "red enlace", "atc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/drkpkg/openhub-bo-integration"
Source = "https://github.com/drkpkg/openhub-bo-integration"
Issues = "https://github.com/drkpkg/openhub-bo-integration/issues"

[tool.maturin]
python-source = "python"
module-name = "openhub_bo.core._native"
features = ["pyo3/extension-module"]
exclude = ["**/__pycache__/**"]
