[workspace]
resolver = "3"
# TypeScript (WASM) and Ruby bindings are separate Cargo workspaces.
exclude = ["bindings/typescript", "bindings/ruby"]
members = [
    "crates/openhub-bo-core",
    "crates/openhub-bo-qr",
    "crates/openhub-bo-fx",
    "crates/openhub-bo-accounts",
    "crates/openhub-bo-payouts",
    "bindings/python/core",
    "bindings/python/qr",
    "bindings/python/fx",
    "bindings/python/accounts",
    "bindings/python/payouts",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/drkpkg/openhub-bo-integration"
homepage = "https://github.com/drkpkg/openhub-bo-integration"
authors = ["Felix Daniel Coca Calvimontes"]
