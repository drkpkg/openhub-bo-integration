<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caja Mercado Central</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
<header class="bg-white border-b border-gray-200">
  <div class="mx-auto max-w-6xl px-4 py-4 flex flex-wrap items-center gap-3">
    <div class="h-9 w-9 rounded-lg bg-indigo-600 text-white grid place-items-center font-semibold">C</div>
    <div>
      <h1 class="text-lg font-semibold leading-tight">Caja · Puesto 14</h1>
      <p class="text-sm text-gray-500">Mercado Central · cobro con QR en mostrador</p>
    </div>
    <span id="powered" class="ml-auto inline-flex items-center rounded-full bg-gray-100 px-3 py-1 text-xs font-medium text-gray-600">TypeScript</span>
  </div>
</header>

<main class="mx-auto max-w-6xl px-4 py-8 grid gap-6 lg:grid-cols-[340px_1fr] items-start">
  <section class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
    <h2 class="text-base font-semibold">Nuevo cobro</h2>
    <div class="mt-4 rounded-lg bg-gray-50 px-4 py-3 text-right">
      <p class="text-xs text-gray-500">Monto (Bs)</p>
      <p id="display" class="font-mono text-4xl font-semibold tracking-tight">0</p>
    </div>
    <div id="keypad" class="mt-4 grid grid-cols-3 gap-2"></div>
    <label class="mt-4 block text-sm font-medium text-gray-700" for="concept">Concepto</label>
    <input id="concept" value="Venta mostrador" maxlength="40"
           class="mt-1 block w-full rounded-lg border-0 px-3 py-2 text-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-indigo-600">
    <div class="mt-4 grid grid-cols-2 gap-2 rounded-lg bg-gray-100 p-1 text-sm font-medium" role="radiogroup">
      <button data-kind="simple" class="kind rounded-md py-1.5">QR Simple</button>
      <button data-kind="mld" class="kind rounded-md py-1.5">QR MLD-BCB</button>
    </div>
    <button id="charge" class="mt-5 w-full rounded-lg bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-40">Cobrar</button>
    <p id="err" class="mt-2 text-sm text-red-600"></p>
  </section>

  <section class="space-y-6">
    <div id="active" class="rounded-xl border border-dashed border-gray-300 bg-white p-8 text-center text-sm text-gray-500">
      Ingresa un monto y presiona <span class="font-medium text-gray-700">Cobrar</span> para mostrar el QR al cliente.
    </div>

    <div class="rounded-xl border border-gray-200 bg-white shadow-sm">
      <div class="flex flex-wrap items-center gap-x-6 gap-y-2 border-b border-gray-200 px-5 py-3">
        <h2 class="text-base font-semibold">Ventas de hoy</h2>
        <p class="text-sm text-gray-500">Cobrado <span id="sumPaid" class="font-semibold text-gray-900">Bs 0,00</span></p>
        <p class="text-sm text-gray-500">Pendiente <span id="sumPending" class="font-semibold text-gray-900">Bs 0,00</span></p>
      </div>
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="bg-gray-50 text-left text-gray-500">
            <tr><th class="px-5 py-2 font-medium">Hora</th><th class="px-5 py-2 font-medium">Concepto</th>
                <th class="px-5 py-2 font-medium">Tipo</th><th class="px-5 py-2 font-medium text-right">Monto</th>
                <th class="px-5 py-2 font-medium">Estado</th><th class="px-5 py-2 font-medium">Ref. ATC</th></tr>
          </thead>
          <tbody id="sales" class="divide-y divide-gray-100">
            <tr><td colspan="6" class="px-5 py-6 text-center text-gray-500">Sin ventas todavía.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<footer id="footer" class="mx-auto max-w-6xl px-4 pb-10 text-xs text-gray-500"></footer>

<script>
const STATUS = {
  pending: ["Esperando pago", "bg-amber-50 text-amber-700 ring-amber-600/20"],
  paid: ["Pagado", "bg-emerald-50 text-emerald-700 ring-emerald-600/20"],
  cancelled: ["Anulado", "bg-gray-100 text-gray-600 ring-gray-500/20"],
  expired: ["Expirado", "bg-gray-100 text-gray-600 ring-gray-500/20"],
  error: ["Error", "bg-red-50 text-red-700 ring-red-600/20"],
};
let amount = "0", kind = "simple", active = null, poll = null, timer = null;
const $ = (id) => document.getElementById(id);
const bs = (n) => "Bs " + Number(n).toLocaleString("es-BO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const badge = (s) => { const [label, cls] = STATUS[s] || [s, "bg-gray-100 text-gray-600 ring-gray-500/20"];
  return `<span class="inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium ring-1 ring-inset ${cls}">${esc(label)}</span>`; };
const btnSecondary = "rounded-lg bg-white px-3 py-2 text-sm font-semibold text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50";
const simTag = (r) => r.simulated ? ` <span class="text-xs text-gray-400">simulado</span>` : "";
const sandboxBox = `<div class="rounded-lg border border-dashed border-gray-300 p-3 text-left">
    <p class="text-xs font-medium uppercase tracking-wide text-gray-500">Sandbox</p>
    <p class="mt-1 text-xs text-gray-500">En el sandbox nadie paga el QR. Esto envía al webhook la notificación de pago con el formato de ATC (pagador ficticio).</p>
    <button id="simulate" class="mt-2 ${btnSecondary}">Simular pago</button></div>`;

async function api(path, options = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (res.status === 401) { location.href = "/login"; throw new Error("Sesión expirada"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(`${data.error || res.statusText}${data.code ? ` (${data.code})` : ""}`);
  return data;
}

const KEYS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", ".", "0", "⌫"];
$("keypad").innerHTML = KEYS.map((k) => `<button data-key="${k}"
  class="rounded-lg bg-white py-3 text-lg font-medium ring-1 ring-inset ring-gray-300 hover:bg-gray-50 active:bg-gray-100">${k}</button>`).join("");

function press(k) {
  if (k === "⌫") amount = amount.length > 1 ? amount.slice(0, -1) : "0";
  else if (k === ".") { if (!amount.includes(".")) amount += "."; }
  else if (/\.\d{2}$/.test(amount)) return;
  else amount = amount === "0" ? k : amount + k;
  renderForm();
}

function renderForm() {
  $("display").textContent = amount;
  document.querySelectorAll(".kind").forEach((b) => {
    const on = b.dataset.kind === kind;
    b.className = `kind rounded-md py-1.5 ${on ? "bg-white text-gray-900 shadow-sm" : "text-gray-500 hover:text-gray-700"}`;
  });
  const value = Number(amount);
  $("charge").disabled = !(value > 0) || value > 10 || !!active;
  $("err").textContent = value > 10 ? "La demo cobra hasta Bs 10." : "";
}

$("keypad").addEventListener("click", (ev) => { const b = ev.target.closest("[data-key]"); if (b) press(b.dataset.key); });
document.querySelectorAll(".kind").forEach((b) => b.addEventListener("click", () => { kind = b.dataset.kind; renderForm(); }));
document.addEventListener("keydown", (ev) => {
  if (ev.target.tagName === "INPUT") return;
  if (/^[0-9.]$/.test(ev.key)) press(ev.key);
  if (ev.key === "Backspace") press("⌫");
});

function countdown(expiresAt) {
  clearInterval(timer);
  const tick = () => {
    const left = Math.max(0, Math.round((new Date(expiresAt) - Date.now()) / 1000));
    const el = $("left"); if (el) el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
  };
  tick(); timer = setInterval(tick, 1000);
}

function renderActive(status, message, st = {}) {
  const box = $("active");
  const final = status !== "pending";
  if (final) { clearInterval(poll); clearInterval(timer); }
  box.className = "rounded-xl border border-gray-200 bg-white p-6 shadow-sm";
  box.innerHTML = `
    <div class="grid gap-6 sm:grid-cols-[auto_1fr] items-center">
      <img alt="QR de cobro" src="${active.qrDataUri}"
           class="mx-auto h-64 w-64 rounded-lg border border-gray-200 bg-white [image-rendering:pixelated] ${final ? "opacity-25" : ""}">
      <div class="space-y-3 text-center sm:text-left">
        <p class="text-sm text-gray-500">${esc(active.label)}</p>
        <p class="text-4xl font-semibold tracking-tight">${bs(active.amount)}</p>
        <div class="flex flex-wrap items-center justify-center gap-2 sm:justify-start">${badge(status)}
          ${final ? "" : `<span class="text-sm text-gray-500">vence en <span id="left" class="font-medium text-gray-700">…</span></span>`}</div>
        <dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-1 text-sm">
          <dt class="text-gray-500">Tipo</dt><dd>${active.kind === "mld" ? "QR MLD-BCB" : "QR Simple"}</dd>
          <dt class="text-gray-500">Ref. ATC</dt><dd class="font-mono">${esc(active.reference)}</dd>
          ${message ? `<dt class="text-gray-500">OpenHub</dt><dd>${esc(message)}</dd>` : ""}
          ${st.payer ? `<dt class="text-gray-500">Pagó</dt><dd>${esc(st.payer)}${st.payerBank ? ` · ${esc(st.payerBank)}` : ""}</dd>` : ""}
          ${status === "paid" ? `<dt class="text-gray-500">Origen</dt><dd>${st.simulated ? "Pago simulado, recibido por webhook" : "Confirmado por OpenHub"}</dd>` : ""}
        </dl>
        <div class="flex flex-wrap justify-center gap-2 sm:justify-start">
          ${final ? `<button id="next" class="rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-700">Siguiente cliente</button>`
                  : `<button id="check" class="${btnSecondary}">Verificar pago</button>
                     ${active.kind === "simple" ? `<button id="void" class="${btnSecondary}">Anular cobro</button>` : ""}`}
        </div>
        <p id="activeErr" class="text-sm text-red-600"></p>
        ${final ? "" : sandboxBox}
      </div>
    </div>`;
  if (!final) countdown(active.expiresAt);
}

async function refresh() {
  if (!active) return;
  try { const st = await api(`/api/qr/${active.kind}/${active.reference}`); renderActive(st.status, st.message, st); loadSales(); }
  catch (e) { const el = $("activeErr"); if (el) el.textContent = e.message; }
}

$("active").addEventListener("click", async (ev) => {
  if (ev.target.id === "check") refresh();
  if (ev.target.id === "void") {
    try { const st = await api(`/api/qr/simple/${active.reference}/cancel`, { method: "POST" }); renderActive(st.status, st.message); loadSales(); }
    catch (e) { $("activeErr").textContent = e.message; }
  }
  if (ev.target.id === "simulate") {
    ev.target.disabled = true; ev.target.textContent = "Enviando webhook…";
    try { const st = await api(`/api/qr/${active.kind}/${active.reference}/simulate`, { method: "POST" }); renderActive(st.status, st.message, st); loadSales(); }
    catch (e) { $("activeErr").textContent = e.message; ev.target.disabled = false; ev.target.textContent = "Simular pago"; }
  }
  if (ev.target.id === "next") {
    active = null; amount = "0";
    $("active").className = "rounded-xl border border-dashed border-gray-300 bg-white p-8 text-center text-sm text-gray-500";
    $("active").innerHTML = `Ingresa un monto y presiona <span class="font-medium text-gray-700">Cobrar</span> para mostrar el QR al cliente.`;
    renderForm();
  }
});

$("charge").addEventListener("click", async () => {
  const label = $("concept").value.trim() || "Venta mostrador";
  $("charge").disabled = true; $("err").textContent = "";
  try {
    active = await api("/api/qr", { method: "POST", body: JSON.stringify({
      kind, amount: Number(amount).toFixed(2), description: `Puesto 14 ${label}`, label, expiresIn: 600 }) });
    active.label = label;
    renderActive(active.status);
    clearInterval(poll); poll = setInterval(refresh, 5000);
    loadSales();
  } catch (e) { $("err").textContent = e.message; }
  renderForm();
});

async function loadSales() {
  try {
    const rows = await api("/api/payments");
    const sum = (s) => rows.filter((r) => r.status === s).reduce((t, r) => t + Number(r.amount), 0);
    $("sumPaid").textContent = bs(sum("paid"));
    $("sumPending").textContent = bs(sum("pending"));
    if (!rows.length) return;
    $("sales").innerHTML = rows.map((r) => `<tr>
      <td class="px-5 py-2 text-gray-500">${new Date(r.createdAt).toLocaleTimeString("es-BO", { hour: "2-digit", minute: "2-digit" })}</td>
      <td class="px-5 py-2">${esc(r.label)}</td>
      <td class="px-5 py-2 text-gray-500">${r.kind === "mld" ? "MLD-BCB" : "Simple"}</td>
      <td class="px-5 py-2 text-right">${bs(r.amount)}</td><td class="px-5 py-2">${badge(r.status)}${simTag(r)}</td>
      <td class="px-5 py-2 font-mono text-xs text-gray-500">${esc(r.reference)}</td></tr>`).join("");
  } catch {}
}

(async () => {
  renderForm();
  const info = await api("/api/info");
  $("powered").textContent = `${info.language} · ${info.library} ${info.version}`;
  $("footer").innerHTML = `Integración real con el sandbox de Red Enlace (ATC) usando <code class="font-mono">${esc(info.library)}</code> (${esc(info.language)}).
    Otras demos: ${(info.links || []).filter((l) => l.language !== info.language)
      .map((l) => `<a class="text-indigo-700 hover:underline" href="${esc(l.url)}">${esc(l.language)}</a>`).join(" · ")}`;
  loadSales(); setInterval(loadSales, 8000);
})();
</script>
</body>
</html>
