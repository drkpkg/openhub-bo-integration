<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo OpenHub · Ingresar</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 antialiased grid place-items-center px-4">
<form method="post" action="/login" class="w-full max-w-sm rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
  <h1 class="text-lg font-semibold">Demo de integración OpenHub</h1>
  <p class="mt-1 text-sm text-gray-500">Sandbox de Red Enlace (ATC). Ingresa la clave de la demo.</p>
  <label for="password" class="mt-5 block text-sm font-medium text-gray-700">Clave</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required autofocus
         class="mt-1 block w-full rounded-lg border-0 px-3 py-2 text-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-gray-900">
  <button type="submit" class="mt-5 w-full rounded-lg bg-gray-900 px-4 py-2.5 text-sm font-semibold text-white hover:bg-gray-800">Ingresar</button>
  <p id="err" class="mt-3 hidden text-sm text-red-600">Clave incorrecta.</p>
</form>
<script>if (location.search.includes("error")) document.getElementById("err").classList.remove("hidden");</script>
</body>
</html>
