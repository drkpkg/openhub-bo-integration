# Builds every openhub-bo distribution and publishes it.
#
#   push tag vX.Y.Z      build + publish to crates.io, PyPI and RubyGems (npm only when
#                        the PUBLISH_NPM repository variable is "true"), then a GitHub release
#   workflow_dispatch    build only ("dry-run"), or build + publish Python to TestPyPI
#   pull_request         build only, when packaging files change
#
# Each package (core, qr, fx, accounts, payouts, and the meta package where
# there is one) builds in its own job. Python wheels and Ruby native gems also
# cross that with the target platform, so a failure is scoped to one package
# and one platform. Smoke tests install the artifacts together afterwards.
#
# Publishing uses trusted publishing (OIDC): no long-lived tokens in the repo.
# Each registry must trust this workflow (repo drkpkg/openhub-bo-integration,
# file release.yml, environment crates-io / pypi-<pkg> / testpypi-<pkg> / npm /
# rubygems); see
# docs/publicacion.md. crates.io and npm only trust packages that already exist,
# so their first release uses a CARGO_REGISTRY_TOKEN / NPM_TOKEN secret instead.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "dry-run: build only · testpypi: build and publish Python to TestPyPI"
        type: choice
        options: [dry-run, testpypi]
        default: dry-run
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release.py
      - bindings/typescript/scripts/build-wasm.mjs
      - "**/Cargo.toml"
      - "**/pyproject.toml"
      - "**/package.json"
      - "**/*.gemspec"
      - "**/Rakefile"
      - bindings/ruby/support/**

permissions:
  contents: read

env:
  # Ruby minor versions with precompiled binaries (other versions use the source gem).
  RUBY_VERSIONS: "3.2,3.3,3.4,4.0"

jobs:
  check:
    name: Versions and license files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/release.py check ${{ startsWith(github.ref, 'refs/tags/v') && format('--tag {0}', github.ref_name) || '' }}

  # ---------------------------------------------------------------- crates.io
  crates-package:
    name: Rust crates (package and verify)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Packages each crate and builds it from the .crate file, against the
      # other crates of this release (not crates.io), without uploading.
      - run: cargo publish --dry-run -p openhub-bo-core -p openhub-bo-qr -p openhub-bo-fx -p openhub-bo-accounts -p openhub-bo-payouts

  publish-crates:
    name: Publish to crates.io
    needs: crates-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write # trusted publishing
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.HAS_TOKEN != 'true'
      # Dependency order: core first. Already published versions are skipped, so
      # a failed release can be re-run.
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for pkg in core qr fx accounts payouts; do
            crate="openhub-bo-$pkg"
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "openhub-bo-release (github.com/$GITHUB_REPOSITORY)" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = 200 ]; then echo "$crate@$version already published"; continue; fi
            cargo publish -p "$crate"
          done

  # ---------------------------------------------------------------- Python
  python-wheels:
    name: Python wheel ${{ matrix.pkg }} (${{ matrix.platform }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        pkg: [core, qr, fx, accounts, payouts]
        platform: [linux-x86_64, linux-aarch64, musllinux-x86_64, musllinux-aarch64, macos-x86_64, macos-arm64, windows-x64]
        # Extra keys are merged into every package that has this platform.
        include:
          - { platform: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { platform: linux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { platform: musllinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { platform: musllinux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { platform: macos-x86_64, os: macos-latest, target: x86_64 }
          - { platform: macos-arm64, os: macos-latest, target: aarch64 }
          - { platform: windows-x64, os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # One wheel per package and platform; abi3 covers Python >= 3.10.
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python/${{ matrix.pkg }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.platform }}-${{ matrix.pkg }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  python-sdist:
    name: Python sdist (${{ matrix.pkg }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [core, qr, fx, accounts, payouts, meta]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build sdist
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          mkdir -p bindings/python/dist
          if [ "$PKG" = meta ]; then
            uv build bindings/python/meta --out-dir bindings/python/dist
          else
            (cd "bindings/python/$PKG" && uvx --from 'maturin>=1.9,<2' maturin sdist --out ../dist)
          fi
          uvx twine check --strict bindings/python/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist-${{ matrix.pkg }}
          path: bindings/python/dist/*
          if-no-files-found: error

  python-smoke:
    name: Python wheels smoke (${{ matrix.name }})
    needs: python-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-x64, os: windows-latest }
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: python-wheels-${{ matrix.name }}-*
          path: wheels
          merge-multiple: true
      - name: Smoke test (install the wheels, no Rust involved)
        shell: bash
        run: |
          python -m pip install -q --only-binary :all: --find-links wheels \
            openhub-bo-qr openhub-bo-fx openhub-bo-accounts openhub-bo-payouts
          cd "$RUNNER_TEMP"  # import the installed wheels, not anything in the workspace
          python -c "import json, openhub_bo.qr, openhub_bo.fx, openhub_bo.accounts, openhub_bo.payouts, openhub_bo.qr._native as n; print(json.loads(n.call('version', '{}')))"

  # One job and environment per project: PyPI accepts only one pending publisher
  # per (repository, workflow, environment), so each project needs its own.
  publish-pypi:
    name: Publish ${{ matrix.project }} to PyPI / TestPyPI
    needs: [python-wheels, python-sdist, python-smoke]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: core, project: openhub-bo-core }
          - { pkg: qr, project: openhub-bo-qr }
          - { pkg: fx, project: openhub-bo-fx }
          - { pkg: accounts, project: openhub-bo-accounts }
          - { pkg: payouts, project: openhub-bo-payouts }
          - { pkg: meta, project: openhub-bo }
    environment: ${{ github.event.inputs.target == 'testpypi' && 'testpypi' || 'pypi' }}-${{ matrix.pkg }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*-${{ matrix.pkg }}
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: ${{ github.event.inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: true

  # ---------------------------------------------------------------- npm
  npm-build:
    name: npm package (${{ matrix.pkg }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [core, qr, fx, accounts, payouts]
    defaults:
      run:
        working-directory: bindings/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:wasm ${{ matrix.pkg }}
      - run: pnpm exec tsc -b packages/${{ matrix.pkg }}
      - run: node --test packages/${{ matrix.pkg }}/test/*.test.ts
      # `pnpm pack` turns workspace:^ into real version ranges.
      - name: Pack
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          mkdir -p dist
          (cd "packages/$PKG" && pnpm pack --pack-destination ../../dist)
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.pkg }}
          path: bindings/typescript/dist/*.tgz
          if-no-files-found: error

  npm-smoke:
    name: npm packages on Node 18
    needs: npm-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: dist
          merge-multiple: true
      - name: Smoke test on Node 18 (oldest supported)
        run: |
          docker run --rm -v "$PWD/dist:/pkgs:ro" node:18-slim bash -c '
            mkdir /app && cd /app && npm init -y >/dev/null &&
            npm install --silent /pkgs/*.tgz &&
            node --input-type=module -e "
              import { Session } from \"@openhub-bo/core\";
              import { QrClient } from \"@openhub-bo/qr\";
              await import(\"@openhub-bo/fx\"); await import(\"@openhub-bo/accounts\"); await import(\"@openhub-bo/payouts\");
              new QrClient(new Session({ clientId: \"x\", clientSecret: \"y\", environment: \"sandbox\" }));
              console.log(\"ok\", process.version);"'

  publish-npm:
    name: Publish to npm
    needs: npm-smoke
    # Off until the npm organization exists: set the PUBLISH_NPM repository variable to "true".
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      # Dependency order: core first. Already published versions are skipped, so
      # a failed release can be re-run.
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in core qr fx accounts payouts; do
            file=$(ls dist/openhub-bo-$pkg-*.tgz)
            version=$(tar -xOzf "$file" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
            if npm view "@openhub-bo/$pkg@$version" version >/dev/null 2>&1; then
              echo "@openhub-bo/$pkg@$version already published"; continue
            fi
            npm publish "$file" --access public --provenance
          done

  # ---------------------------------------------------------------- RubyGems
  ruby-native:
    name: Ruby gem ${{ matrix.pkg }} (${{ matrix.platform }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [core, qr, fx, accounts, payouts]
        platform: [x86_64-linux, x86_64-linux-musl, aarch64-linux, aarch64-linux-musl, x86_64-darwin, arm64-darwin, x64-mingw-ucrt]
    defaults:
      run:
        working-directory: bindings/ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: gem install --no-document rb_sys rake-compiler minitest
      # Vendors this gem's crates on the host: the build container only sees the gem directory.
      - name: Cross-compile
        env:
          PKG: ${{ matrix.pkg }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          (cd "openhub-bo-$PKG" && rake vendor)
          rb-sys-dock --platform "$PLATFORM" --ruby-versions "$RUBY_VERSIONS" -d "$PWD/openhub-bo-$PKG" --build
          mkdir -p dist && cp "openhub-bo-$PKG/pkg/"*-"$PLATFORM".gem dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ruby-gems-${{ matrix.pkg }}-${{ matrix.platform }}
          path: bindings/ruby/dist/*.gem
          if-no-files-found: error

  ruby-source:
    name: Ruby source gem (${{ matrix.pkg }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [core, qr, fx, accounts, payouts, meta]
    defaults:
      run:
        working-directory: bindings/ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: gem install --no-document rb_sys rake-compiler minitest
      - name: Build source gem
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          if [ "$PKG" = meta ]; then
            rake build_meta
            mkdir -p dist && cp openhub-bo/pkg/*.gem dist/
          else
            (cd "openhub-bo-$PKG" && rake gem)
            mkdir -p dist && cp "openhub-bo-$PKG/pkg/"*.gem dist/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ruby-gems-source-${{ matrix.pkg }}
          path: bindings/ruby/dist/*.gem
          if-no-files-found: error

  ruby-smoke:
    name: Ruby precompiled gems on Ruby ${{ matrix.ruby }}
    needs: [ruby-native, ruby-source]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "4.0"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ruby-gems-*
          path: gems
          merge-multiple: true
      # The official Ruby image has no Rust: the gems must load precompiled.
      - run: |
          docker run --rm -v "$PWD/gems:/gems:ro" ruby:${{ matrix.ruby }}-slim bash -c '
            cd /gems &&
            for pkg in core qr fx accounts payouts; do gem install --no-document --local openhub-bo-$pkg-*-x86_64-linux.gem || exit 1; done &&
            gem install --no-document --local openhub-bo-0*.gem &&
            ruby -e "
              %w[core qr fx accounts payouts].each { |p| require \"openhub_bo/#{p}\" }
              so = \$LOADED_FEATURES.grep(/openhub_bo_qr\\.so/).first
              abort \"not precompiled: #{so}\" unless so.include?(\"-x86_64-linux/\")
              puts \"ok #{RUBY_VERSION} #{so}\""'

  publish-rubygems:
    name: Publish to RubyGems
    needs: ruby-smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ruby-gems-*
          path: gems
          merge-multiple: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      # Already published files are skipped, so a failed release can be re-run.
      - run: |
          for file in gems/*.gem; do
            out=$(gem push "$file" 2>&1) && echo "$out" && continue
            echo "$out" | grep -q "Repushing of gem versions is not allowed" && { echo "$(basename "$file") already published"; continue; }
            echo "$out"; exit 1
          done

  # ---------------------------------------------------------------- GitHub release
  github-release:
    name: GitHub release
    needs: [publish-crates, publish-pypi, publish-npm, publish-rubygems]
    # Runs when publish-npm is skipped (PUBLISH_NPM unset), but not after a failure.
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && !failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Release notes: the CHANGELOG section of this version.
          awk -v v="$version" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "openhub-bo $version" --notes-file notes.md artifacts/*
